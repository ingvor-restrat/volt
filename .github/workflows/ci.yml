name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: cargo fmt --all --check
      - run: cargo clippy --release --locked --workspace --all-targets --features volt-compute/live-risk -- -D warnings
      - run: cargo test --release --locked --workspace --features volt-compute/live-risk
      - run: target/release/live_option_risk --once --output target/live-risk-ui-snapshot.json
      - run: node crates/volt-compute/tests/live_risk_render.cjs target/live-risk-ui-snapshot.json
      - run: cargo doc --release --locked --workspace --no-deps --features volt-compute/live-risk
        env:
          RUSTDOCFLAGS: -D warnings
