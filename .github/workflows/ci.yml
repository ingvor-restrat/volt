name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --release --locked --workspace --all-targets -- -D warnings
      - run: cargo test --release --locked --workspace
      - run: cargo doc --release --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
